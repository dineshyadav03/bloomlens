[project]
name = "bloomlens"
version = "0.1.0"
description = "Cut-flower species ID, condition note and simulated price from a photo (portfolio project)."
readme = "README.md"
license = "MIT"
# 3.14 is blocked by torch==2.6.0 (no cp314 wheels); <3.11 is untested.
requires-python = ">=3.11,<3.14"

# Runtime dependencies: the exact versions this project was developed and CI-tested
# against. Transitive dependencies are pinned by uv.lock, not here.
dependencies = [
    "streamlit==1.50.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "open_clip_torch==2.32.0",
    "qdrant-client==1.12.1",
    "Pillow==11.0.0",
    "google-genai==2.22.0",
    "langchain==1.4.0",
    "langchain-google-genai==4.4.0",
    "python-dotenv==1.0.1",
    "pandas==2.2.3",
    "pydantic==2.13.5",
    "numpy==2.1.3",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
# Only needed to rebuild the evaluation test set (eval/build_test_set.py):
# torchvision's Flowers102 loader calls scipy.io.loadmat. Nothing at runtime or in
# CI imports scipy. Left as a range so the universal lock resolves the newest
# release each supported Python allows (scipy 1.18 needs >=3.12).
eval-data = ["scipy>=1.16"]
# Inter-rater statistics for the quality-validation study (used from Milestone 16).
eval-quality = [
    "scipy>=1.16",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "krippendorff>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "httpx>=0.27",
    "ruff==0.16.7",
    "pip-audit>=2.7",
]

[tool.uv]
# BloomLens is an application, not an installable package: src/, api/ and app.py
# are imported from the repository root.
package = false

# CPU-only torch/torchvision on Linux and Windows (no GPU anywhere in this
# project); macOS gets the regular PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
pythonpath = ["."]
# Only loopback connections are allowed in tests: a test that would reach the
# real Gemini API (or the Hugging Face Hub) fails loudly instead of quietly
# spending quota or depending on the network. Loopback stays open because
# FastAPI's TestClient and asyncio use it internally.
addopts = "-ra --strict-markers --allow-hosts=127.0.0.1,::1"
markers = [
    "integration: needs the pinned BioCLIP 2 weights and takes minutes (CI runs these once, on Ubuntu / Python 3.13)",
]

[tool.coverage.run]
source = ["src", "api"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "BLE"]
ignore = [
    "B008",  # function-call-in-default-argument -- FastAPI's own idiom (e.g. `= File(...)`)
]
