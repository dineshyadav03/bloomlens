name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same PR cancels that PR's still-running older run.
# Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Cost control. The whole PR is diffed against main, and pushes to main always
  # run everything. `code` is false only when every changed file is
  # documentation (docs/, *.md, LICENSE) -- such a PR can't break an install,
  # an import or an eval, so only the cheap lint job runs. `docker` is true
  # only when something that can change an image changed; the two Docker jobs
  # are the slowest (a full image build each).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # the PR merge commit and its base parent
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "Files changed in this PR:"
          echo "$changed"

          if [ -n "$(echo "$changed" | grep -vE '^(docs/|LICENSE$|.*\.md$)' || true)" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only change: skipping install/import, eval and Docker jobs."
          fi

          if echo "$changed" | grep -qE '^(Dockerfile|Dockerfile\.hf|docker-compose\.yml|\.dockerignore|pyproject\.toml|uv\.lock|\.python-version|\.github/workflows/ci\.yml|app\.py|api/|src/|scripts/|data/|\.streamlit/)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "No image-relevant files changed: skipping the Docker jobs."
          fi

  # Once, on one platform: static checks that don't depend on OS or Python.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Check the lockfile is up to date with pyproject.toml
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run --frozen ruff check .

  # Cheap and broad: does the locked environment install and import on every
  # supported Python/OS combination, and do the unit tests pass? No model weights,
  # no real network (pytest-socket allows loopback only), no inference -- so what
  # this proves (and what it doesn't) is stated plainly in the README.
  unit-tests:
    name: unit-tests (${{ matrix.os }}, py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.29"
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Dependency consistency
        run: uv pip check

      - name: Import the project
        run: |
          uv run --frozen python -c "
          import platform, sys
          import src.identify, src.interpretability, src.inventory, src.embeddings, api.main
          import open_clip, torch
          print(platform.platform(), '| python', sys.version.split()[0], '| torch', torch.__version__, '| open_clip', open_clip.__version__)
          "

      - name: Unit tests
        run: uv run --frozen pytest -m "not integration" -q

  # Once, on one platform: the expensive part. Real BioCLIP 2 weights and a real
  # Qdrant index: the full test suite (unit + integration) with a coverage floor,
  # then the retrieval-accuracy gate.
  integration-and-eval:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.29"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --frozen --no-dev

      - name: Cache the pinned BioCLIP 2 weights
        # ~1.7 GB. Keyed on src/versions.py, where the pinned revision and
        # checksums live: a new pin invalidates the cache, nothing else does.
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-bioclip2-${{ hashFiles('src/versions.py') }}

      - name: Build the local Qdrant index
        # eval/run_eval.py queries a pre-built collection -- locally this was
        # masked by an already-populated qdrant_data/ from earlier milestones
        # (correctly gitignored, so absent on a fresh checkout). Caught by
        # actually running this workflow, not assumed.
        run: uv run --frozen python scripts/build_index.py

      - name: Full test suite (unit + integration) with coverage
        # After build_index, so the pinned weights are already on disk; pytest-socket
        # still blocks every non-loopback connection, so nothing can reach Gemini.
        run: uv run --frozen pytest -q --cov --cov-report=term-missing:skip-covered --cov-fail-under=95

      - name: Run evaluation harness
        # eval/test_images/ is committed (small, ~15MB) specifically so this
        # needs no network access to the slow external Oxford 102 server --
        # see docs/RESEARCH.md for why that call was reversed from Milestone 5.
        run: uv run --frozen python eval/run_eval.py

  docker-smoke-test:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file
        # --quiet: never print the resolved config (it would include any
        # env_file secrets).
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start the stack
        # No .env / GEMINI_API_KEY needed for this smoke test -- /health on
        # both services responds without touching the identify() pipeline,
        # so there's nothing here that needs a secret.
        run: docker compose up -d

      - name: Wait for build-index to finish, then check both services' health
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Status}}' "$(docker compose ps -q build-index)" 2>/dev/null || echo "starting")
            [ "$status" = "exited" ] && break
            sleep 5
          done
          docker compose logs build-index

          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 3
          done
          curl -sf http://localhost:8000/health

          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health && break
            sleep 3
          done
          curl -sf http://localhost:8501/_stcore/health

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  hf-space-build:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build the Hugging Face Space image
        # Build-only, no `run`/no secrets needed -- this just proves
        # Dockerfile.hf (a separate, HF-specific Dockerfile; see
        # docs/ARCHITECTURE.md's "Deployment: Hugging Face Spaces" section
        # for why it differs from the root Dockerfile) still builds on
        # every push, on GitHub's fast network instead of this project's
        # slow local one -- same reasoning as docker-smoke-test above.
        run: docker build -f Dockerfile.hf -t bloomlens-hf .
