name: Security

# Kept apart from ci.yml on purpose: new advisories appear against dependencies that
# have not changed, so the audit also runs on a schedule, and neither job depends on
# the docs-only path filter that ci.yml uses to save minutes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # Mondays

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.29"
          python-version: "3.13"

      - name: Audit the locked runtime dependencies
        # Fails on any advisory not listed, with a written reason, in
        # docs/security/audit-triage.json. Only the dev group is installed (that is
        # where pip-audit lives); the runtime set is exported from uv.lock, not installed.
        run: uv run --frozen --only-group dev python scripts/audit_dependencies.py

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not just the tip

      - name: Install gitleaks (pinned release, checksum-verified)
        run: |
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -sSfL --retry 3 -o gitleaks.tar.gz "${base}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL --retry 3 -o checksums.txt "${base}/gitleaks_${version}_checksums.txt"
          expected=$(grep " gitleaks_${version}_linux_x64.tar.gz\$" checksums.txt | cut -d' ' -f1)
          echo "${expected}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan the full git history
        # --redact: a finding is reported without printing the secret itself.
        run: ./gitleaks git --redact --no-banner --verbose .
